<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="container">

    <!-- Header / Total Balance -->
    <header class="header">
      <h1>💸 Expense Tracker</h1>
      <div class="header-right">
        <div class="balance-card">
          <span class="balance-label">Total Expenses</span>
          <span class="balance-amount" id="totalAmount">$0.00</span>
        </div>
        <!-- Challenge 1: Dark/Light mode toggle -->
        <button class="btn-theme" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main grid: form + chart on top, list below -->
    <main class="main-grid">

      <!-- Input Form -->
      <section class="card form-section">
        <h2>Add Expense</h2>
        <form id="expenseForm" novalidate>

          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input
              type="text"
              id="itemName"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="error-msg" id="nameError">Please enter an item name.</span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              placeholder="e.g. 4.50"
              min="0.01"
              step="0.01"
            />
            <span class="error-msg" id="amountError">Please enter a valid amount.</span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select a category --</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚌 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
            <span class="error-msg" id="categoryError">Please select a category.</span>
          </div>

          <!-- Challenge 3: Spending limit -->
          <div class="form-group">
            <label for="spendingLimit">Spending Limit ($) <span class="label-optional">optional</span></label>
            <input
              type="number"
              id="spendingLimit"
              placeholder="e.g. 50.00"
              min="0.01"
              step="0.01"
            />
            <span class="limit-hint" id="limitHint"></span>
          </div>

          <button type="submit" class="btn-add">+ Add Expense</button>
        </form>
      </section>

      <!-- Pie Chart -->
      <section class="card chart-section">
        <h2>Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="expenseChart"></canvas>
          <p class="chart-empty" id="chartEmpty">No data yet. Add an expense to see the chart.</p>
        </div>
      </section>

    </main>

    <!-- Transaction List -->
    <section class="card list-section">
      <!-- Challenge 2: Sort controls -->
      <div class="list-header">
        <h2>Transaction History</h2>
        <div class="sort-controls">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect">
            <option value="date-desc">Date (newest)</option>
            <option value="date-asc">Date (oldest)</option>
            <option value="amount-desc">Amount (high → low)</option>
            <option value="amount-asc">Amount (low → high)</option>
            <option value="category-asc">Category (A → Z)</option>
          </select>
        </div>
      </div>
      <div class="list-wrapper" id="transactionList">
        <p class="list-empty" id="listEmpty">No transactions yet. Start adding expenses above!</p>
      </div>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
